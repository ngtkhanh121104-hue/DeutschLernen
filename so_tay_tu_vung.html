<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sổ tay ghi lại từ vựng tiếng Đức theo từng buổi học">
    <title>Sổ tay từ vựng tiếng Đức</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="vocab-page">
    <header class="site-header" id="top">
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="flag">🇩🇪</span> Deutsch A1</a>
            <nav class="site-nav" aria-label="Điều hướng chính">
                <a href="mau_cau.html" class="nav-link">Mẫu câu giao tiếp</a>
                <a href="ngu_phap.html" class="nav-link">Ngữ pháp</a>
                <a href="chia_dong_tu.html" class="nav-link">Chia động từ</a>
                <a href="so_tay_tu_vung.html" class="nav-link active" aria-current="page">Sổ tay từ vựng</a>
            </nav>
        </div>
        <div class="stripe"></div>
    </header>

    <header class="page-header">
        <p class="eyebrow">Wortschatz · Lerntagebuch</p><br>
        <h1>Sổ tay từ vựng</h1>
        <p class="subtitle">
            Những từ mới được ghi lại sau mỗi buổi học. Chọn một ngày để mở nội dung chi tiết.
        </p>
    </header>

    <!-- Các thẻ ngày học sẽ được JavaScript tạo tại đây -->
    <main id="lessonList" class="lesson-list" aria-label="Danh sách buổi học"></main>

    <footer class="site-footer">
        <p>© 2026 Học Tiếng Đức A1 Miễn Phí. Viel Erfolg!</p>
    </footer>

    <!-- Chỉ cần một modal, nội dung sẽ thay đổi theo ngày được chọn -->
    <dialog id="vocabModal" class="vocab-modal" aria-labelledby="modalTitle">
        <div class="modal-shell">
            <header class="modal-header">
                <div>
                    <p id="modalDate" class="modal-date"></p>
                    <h2 id="modalTitle" class="modal-title"></h2>
                </div>
                <button id="closeModal" class="close-modal" type="button" aria-label="Đóng">&times;</button>
            </header>

            <div id="modalContent" class="modal-content"></div>
        </div>
    </dialog>

    <script>
        /*
         * THÊM BUỔI HỌC MỚI TẠI ĐÂY.
         * Có thể để trống một nhóm bằng dấu ngoặc vuông: []
         */
        const lessonData = [
            {
                id: "2026-07-20",
                date: "20/07/2026",
                title: "Frühstück",
                note: "Từ vựng về bữa sáng và cách diễn tả mức độ thường xuyên.",
                nouns: {
                    der: [
                        { word: "der Käse", meaning: "phô mai", extra: "Thường không dùng số nhiều" },
                        { word: "der Schinken", meaning: "thịt nguội, giăm bông", extra: "Thường không dùng số nhiều" },
                        { word: "der Joghurt", meaning: "sữa chua", extra: "Số nhiều: die Joghurts" },
                        { word: "der Saft", meaning: "nước ép", extra: "Số nhiều: die Säfte" },
                        { word: "der Becher", meaning: "cốc, hộp đựng", extra: "Số nhiều: die Becher" },
                        { word: "der Liter", meaning: "lít", extra: "Số nhiều: die Liter; cũng có thể dùng das Liter" }
                    ],
                    die: [
                        { word: "die Butter", meaning: "bơ", extra: "Thường không dùng số nhiều" },
                        { word: "die Wurst", meaning: "xúc xích", extra: "Số nhiều: die Würste" },
                        { word: "die Dose", meaning: "lon, hộp kim loại", extra: "Số nhiều: die Dosen" },
                        { word: "die Flasche", meaning: "chai, lọ", extra: "Số nhiều: die Flaschen" }
                    ],
                    das: [
                        { word: "das Brot", meaning: "bánh mì", extra: "Số nhiều: die Brote" },
                        { word: "das Brötchen", meaning: "bánh mì nhỏ", extra: "Số nhiều: die Brötchen" },
                        { word: "das Müsli", meaning: "ngũ cốc", extra: "Số nhiều: die Müslis" },
                        { word: "das Croissant", meaning: "bánh sừng bò", extra: "Số nhiều: die Croissants" },
                        { word: "das Ei", meaning: "trứng", extra: "Số nhiều: die Eier" },
                        { word: "das Obst", meaning: "hoa quả", extra: "Không có số nhiều" },
                        { word: "das Gramm", meaning: "gam", extra: "Số nhiều không đổi: die Gramm" },
                        { word: "das Kilo", meaning: "kilôgam, cân", extra: "Số nhiều: die Kilos" }
                    ]
                },
                verbs: [],
                adjectives: [],
                others: [
                    { word: "immer", meaning: "luôn luôn", example: "Ich trinke immer Saft zum Frühstück." },
                    { word: "meistens", meaning: "thường xuyên, hầu hết các lần", example: "Ich trinke meistens Saft zum Frühstück." },
                    { word: "oft", meaning: "thường", example: "Ich trinke oft Saft zum Frühstück." },
                    { word: "manchmal", meaning: "thỉnh thoảng", example: "Ich trinke manchmal Saft zum Frühstück." },
                    { word: "selten", meaning: "hiếm khi", example: "Ich trinke selten Saft zum Frühstück." },
                    { word: "nie", meaning: "không bao giờ", example: "Ich trinke nie Saft zum Frühstück." }
                ]
            }
        ];

        const lessonList = document.getElementById("lessonList");
        const modal = document.getElementById("vocabModal");
        const modalDate = document.getElementById("modalDate");
        const modalTitle = document.getElementById("modalTitle");
        const modalContent = document.getElementById("modalContent");
        const closeModalButton = document.getElementById("closeModal");

        function getWordCount(lesson) {
            const nounCount = Object.values(lesson.nouns)
                .reduce((total, words) => total + words.length, 0);

            return nounCount
                + lesson.verbs.length
                + lesson.adjectives.length
                + lesson.others.length;
        }

        function renderLessonCards() {
            lessonList.innerHTML = lessonData.map(lesson => `
                <button class="lesson-card" type="button" data-lesson-id="${lesson.id}"
                        aria-label="Mở từ vựng ngày ${lesson.date}: ${lesson.title}">
                    <time class="lesson-date" datetime="${lesson.id}">${lesson.date}</time>
                    <h2 class="lesson-title">${lesson.title}</h2>
                    <p class="lesson-note">${lesson.note}</p>
                    <span class="lesson-meta">
                        <span>${getWordCount(lesson)} từ đã ghi</span>
                        <span class="open-label">Mở sổ →</span>
                    </span>
                </button>
            `).join("");
        }

        function renderWordItems(words) {
            if (!words.length) {
                return '<p class="empty-text">Chưa ghi từ nào.</p>';
            }

            return `
                <ul class="word-list">
                    ${words.map(item => `
                        <li class="word-item">
                            <span class="german-word">${item.word}</span>
                            <span class="word-meaning">${item.meaning}</span>
                            ${item.extra ? `<span class="word-extra">${item.extra}</span>` : ""}
                        </li>
                    `).join("")}
                </ul>
            `;
        }

        function renderNouns(nouns) {
            return `
                <section class="word-section">
                    <h3 class="section-heading">Danh từ (Nomen)</h3>
                    <div class="noun-columns">
                        <div class="gender-column der">
                            <h4 class="gender-title">der · Giống đực</h4>
                            ${renderWordItems(nouns.der)}
                        </div>
                        <div class="gender-column die">
                            <h4 class="gender-title">die · Giống cái</h4>
                            ${renderWordItems(nouns.die)}
                        </div>
                        <div class="gender-column das">
                            <h4 class="gender-title">das · Giống trung</h4>
                            ${renderWordItems(nouns.das)}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderTableSection(title, words, columns) {
            if (!words.length) return "";

            return `
                <section class="word-section">
                    <h3 class="section-heading">${title}</h3>
                    <div class="simple-table-wrap">
                        <table class="word-table">
                            <thead>
                                <tr>${columns.map(column => `<th>${column.label}</th>`).join("")}</tr>
                            </thead>
                            <tbody>
                                ${words.map(item => `
                                    <tr>
                                        ${columns.map(column => `<td>${item[column.key] || "—"}</td>`).join("")}
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                </section>
            `;
        }

        function openLesson(lessonId) {
            const lesson = lessonData.find(item => item.id === lessonId);
            if (!lesson) return;

            modalDate.textContent = `Buổi học ngày ${lesson.date}`;
            modalTitle.textContent = lesson.title;
            modalContent.innerHTML = `
                ${renderNouns(lesson.nouns)}
                ${renderTableSection("Động từ (Verben)", lesson.verbs, [
                    { key: "word", label: "Động từ" },
                    { key: "meaning", label: "Nghĩa" },
                    { key: "form", label: "Các dạng" },
                    { key: "example", label: "Ví dụ" }
                ])}
                ${renderTableSection("Tính từ (Adjektive)", lesson.adjectives, [
                    { key: "word", label: "Tính từ" },
                    { key: "meaning", label: "Nghĩa" },
                    { key: "example", label: "Ví dụ" }
                ])}
                ${renderTableSection("Từ và cụm từ khác", lesson.others, [
                    { key: "word", label: "Từ / Cụm từ" },
                    { key: "meaning", label: "Nghĩa" },
                    { key: "example", label: "Ví dụ" }
                ])}
            `;

            modal.showModal();
        }

        lessonList.addEventListener("click", event => {
            const card = event.target.closest(".lesson-card");
            if (card) openLesson(card.dataset.lessonId);
        });

        closeModalButton.addEventListener("click", () => modal.close());

        // Bấm vào vùng tối bên ngoài để đóng modal.
        modal.addEventListener("click", event => {
            if (event.target === modal) modal.close();
        });

        renderLessonCards();
    </script>
</body>
</html>
